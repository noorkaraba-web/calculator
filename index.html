<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Calculator</title>
<style>
  :root{
    --bg:#1B1E26;
    --panel:#242833;
    --panel2:#2C313D;
    --line:#3A3F4D;
    --text:#E7E9EE;
    --muted:#8B92A3;
    --gold:#D9A441;
    --gold-dim:#A87E36;
    --green:#4FAE82;
    --red:#D9685F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;}
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 80px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-size:22px;
    letter-spacing:0.02em;
    margin:0;
    font-weight:700;
  }
  h1 span{color:var(--gold);}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .grid{
    display:grid;
    grid-template-columns: 380px 1fr;
    gap:20px;
  }
  @media (max-width: 860px){
    .grid{grid-template-columns:1fr;}
    .wrap{padding:20px 16px 60px;}
  }

  /* ── General layout / form responsiveness ─────────────────── */
  @media (max-width: 600px){
    .wrap{padding:16px 12px 48px;}
    h1{font-size:19px;}
    .sub{font-size:12px;}
    header{margin-bottom:18px;}
    .card{padding:16px;border-radius:9px;}
    .card h2{font-size:12px;margin-bottom:12px;}
    label{font-size:11.5px;}
    /* Prevent iOS auto-zoom on focus + keep inputs comfortably tappable */
    input, select{font-size:16px;padding:10px;}
    .row2{grid-template-columns:1fr;gap:0;}
    .vat-opt{font-size:12.5px;padding:8px 9px;flex-wrap:wrap;}
    .calc-line{font-size:12px;flex-wrap:wrap;gap:4px;}
    .btn-primary,.btn-secondary{font-size:13px;padding:10px;}

    /* Preview header: toggle + lang switch + action buttons all wrap cleanly */
    .preview-head{gap:10px;}
    .toggle button{padding:7px 13px;font-size:12.5px;}
    .actions{width:100%;flex-wrap:wrap;gap:6px;}
    .actions .icon-btn{flex:1 1 auto;min-width:0;font-size:12px;padding:9px 8px;text-align:center;white-space:nowrap;}

    .saved-item{font-size:12px;padding:7px 9px;}
    .saved-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  }

  @media (max-width: 420px){
    .actions{flex-direction:column;}
    .actions .icon-btn{width:100%;}
    .toggle{width:100%;justify-content:center;}
    #buyerLangWrap{width:100%;text-align:center;}
  }

  /* ── Desktop: keep the layout tight, no excessive whitespace ── */
  @media (min-width: 1200px){
    .wrap{max-width:1240px;}
    .grid{grid-template-columns:400px 1fr;}
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  .card h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    margin:0 0 16px;
    font-weight:600;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
    margin-top:14px;
  }
  label:first-of-type{margin-top:0;}
  input, select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:7px;
    color:var(--text);
    padding:9px 10px;
    font-size:14px;
    font-family:inherit;
  }
  input.num-input{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  input:focus, select:focus{outline:none;border-color:var(--gold-dim);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .vat-options{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .vat-opt{
    display:flex;align-items:center;gap:10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:9px 10px;cursor:pointer;font-size:13px;
  }
  .vat-opt input[type=radio]{width:auto;margin:0;accent-color:var(--gold);}
  .vat-opt.active{border-color:var(--gold-dim);background:#33302344;}
  .vat-opt .tag{color:var(--muted);font-size:11px;margin-left:auto;font-family:'IBM Plex Mono',monospace;}

  .calc-line{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12.5px;color:var(--muted);
    padding:6px 0;border-top:1px solid var(--line);margin-top:6px;
  }
  .calc-line b{color:var(--text);font-family:'IBM Plex Mono',monospace;font-weight:600;}

  .btn-primary{
    width:100%;
    margin-top:18px;
    background:var(--gold);
    color:#1B1E26;
    border:none;
    border-radius:7px;
    padding:11px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .btn-primary:hover{background:#E6B158;}
  .btn-secondary{
    width:100%;
    margin-top:8px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:9px;
    font-size:13px;
    cursor:pointer;
  }
  .btn-secondary:hover{border-color:var(--gold-dim);}
  .btn-link{
    background:none;border:none;color:var(--gold);font-size:11.5px;
    cursor:pointer;padding:0;text-decoration:underline;
  }

  /* Preview pane */
  .preview-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
    gap:12px;
    flex-wrap:wrap;
  }
  .toggle{
    display:flex;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
  }
  .toggle button{
    border:none;
    background:transparent;
    color:var(--muted);
    padding:7px 16px;
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .toggle button.active.internal{background:var(--red);color:#fff;}
  .toggle button.active.buyer{background:var(--green);color:#0e1410;}
  .actions{display:flex;gap:8px;}
  .icon-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:8px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .icon-btn:hover{border-color:var(--gold-dim);}

  .quote{
    background:#fff;
    color:#1B1E26;
    border-radius:10px;
    padding:32px;
    position:relative;
    overflow:hidden;
    min-height:480px;
    --card-pad-x:32px;
    --card-pad-y:32px;
  }
  /* ── Photo sidebar (buyer view only, shown when a car photo is uploaded) ── */
  .quote.q-has-split{padding:0 !important;}
  .q-split{display:flex;align-items:stretch;min-height:480px;}
  .q-photo-side{
    flex:0 0 34%;
    min-width:150px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px 18px;
    background-color:#e5e5e5;
  }
  /* Soft blurred backdrop (same photo, scaled+blurred) fills the box so the
     full photo can be shown via object-fit:contain without ugly empty bars. */
  .q-photo-bg{
    position:absolute;
    inset:-12px;
    background-size:cover;
    background-position:center;
    filter:blur(18px) brightness(0.85) saturate(1.1);
    transform:scale(1.15);
  }
  .q-photo-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    z-index:1;
  }
  .q-photo-side::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:2;
    background:linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.02) 30%, rgba(0,0,0,0.02) 55%, rgba(0,0,0,0.62) 100%);
  }
  .q-photo-side > .q-badge,
  .q-photo-side > .q-photo-name{position:relative;z-index:3;}
  .q-photo-side .q-badge{align-self:flex-start;}
  .q-photo-name{
    color:#fff;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:24px;
    font-weight:800;
    line-height:1.15;
    text-shadow:0 2px 8px rgba(0,0,0,0.5);
  }
  .q-content{
    flex:1;
    min-width:0;
    padding:28px 28px 28px 24px;
    display:flex;
    flex-direction:column;
  }
  .q-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-bottom:22px;
  }
  .q-logo{height:34px;width:auto;flex-shrink:0;}
  .q-badge{
    display:inline-block;
    font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;
    padding:4px 11px;border-radius:999px;margin-bottom:10px;
  }
  .q-badge.internal{background:#FBE2E0;color:#B23B30;}
  .q-badge.buyer{background:#FBE2E0;color:#B23B30;}
  .q-car{font-size:24px;font-weight:800;margin-bottom:2px;}
  .q-plate{font-size:13px;color:#6b7280;margin-bottom:2px;}
  .q-date{font-size:12px;color:#9aa1ad;margin-bottom:24px;}
  .q-table{width:100%;border-collapse:collapse;font-size:14px;}
  .q-table td{padding:10px 0;border-bottom:1px solid #E5E7EB;}
  .q-table td:last-child{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .q-table tr.muted td{color:#6b7280;font-size:12.5px;}
  .q-table tr.section td{
    color:#9aa1ad;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;
    border-bottom:none;padding-top:18px;padding-bottom:2px;
  }
  .q-total td{
    font-weight:800;
    font-size:18px;
    border-bottom:none;
    border-top:2px solid #1B1E26;
    padding-top:16px;
  }
  .q-foot{margin-top:28px;font-size:11.5px;color:#9aa1ad;line-height:1.5;}

  /* Arabic RTL buyer quote */
  .quote[dir="rtl"]{direction:rtl;}
  .quote[dir="rtl"] .q-head{flex-direction:row-reverse;}
  .quote[dir="rtl"] .q-head > div:first-child{flex-direction:row-reverse;}
  .quote[dir="rtl"] .q-split{flex-direction:row;}
  .quote[dir="rtl"] .q-photo-name{text-align:right;}


  /* New dual-currency comfortable table */
  .q-table2{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed;}

  /* LTR column widths: label 44% | KRW 28% | USD 28% */
  .q-table2 col.c-lbl{width:44%;}
  .q-table2 col.c-krw{width:28%;}
  .q-table2 col.c-fx {width:28%;}

  /* Base cell padding — same for th and td so header locks with data */
  .q-table2 th,.q-table2 td{padding:10px 0;vertical-align:middle;}
  .q-table2 th{
    font-size:11px;text-transform:uppercase;letter-spacing:0.06em;
    color:#9aa1ad;padding-bottom:8px;border-bottom:2px solid #1B1E26;font-weight:700;
  }
  .q-table2 td{border-bottom:1px solid #E5E7EB;}

  /* Column alignment classes */
  .q-table2 .col-lbl{text-align:left;padding-left:0;padding-right:8px;}
  .q-table2 .col-krw{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    white-space:nowrap;
    padding-left:8px;
    padding-right:8px;
  }
  .q-table2 .col-fx{
    text-align:center;
    font-family:'IBM Plex Mono',monospace;
    white-space:nowrap;
    padding-left:8px;
    padding-right:8px;
  }

  /* Colour classes */
  .q-table2 .krw-reg{color:#4b5563;}
  .q-table2 .krw-mut{color:#9aa1ad;font-size:12.5px;}
  .q-table2 .fx-reg {color:#6B0000;font-weight:700;}
  .q-table2 .fx-mut {color:#9aa1ad;font-size:12.5px;}
  .q-table2 .lbl-mut{color:#6b7280;font-size:12.5px;}

  /* Section sub-headers */
  .q-table2 tr.section td{
    color:#6b7280;font-size:10.5px;text-transform:uppercase;
    letter-spacing:0.14em;font-weight:700;
    border-bottom:none;padding-top:20px;padding-bottom:4px;text-align:left;
  }

  /* Total row */
  /* Divider row: identical to header border-bottom — border-bottom:2px solid #1B1E26 */
  .q-table2 tr.total-divider td{
    padding:0 !important;
    height:0;
    line-height:0;
    font-size:0;
    border:none !important;
    border-bottom:2px solid #1B1E26 !important;
  }
  .q-table2 tr.total td{
    font-weight:800;font-size:15px;border-bottom:none;border-top:none;padding-top:22px;
  }

  .q-table2 tr.total .fx-reg{color:#0a5c39;}

  /* ── Arabic RTL overrides ──
     In RTL the visual column order is [USD][KRW][Label] left→right.
     We keep direction:ltr on number cells via the markup (col-krw/col-fx),
     and only flip the label alignment here. The padding on col-krw/col-fx
     already creates the gap between the two number columns.
  */
  /* RTL overrides */
  .quote[dir="rtl"] .q-table2 .col-lbl{text-align:right;padding-right:0;padding-left:8px;}
  /* USD/FX column: visually on the LEFT in RTL — left-align values so they hug the left edge */
  /* LTR: USD header centered same as values — no separate rule needed */
  .q-table2 th.col-fx{text-align:center;padding-left:8px;padding-right:8px;}
  /* RTL: USD on left — header and values both left-aligned with identical padding */
  .quote[dir="rtl"] .q-table2 .col-fx{text-align:center;padding-left:8px;padding-right:8px;}
  .quote[dir="rtl"] .q-table2 th.col-fx{text-align:center;padding-left:8px;padding-right:8px;}
  .quote[dir="rtl"] .q-table2 tr.section td{text-align:right;padding-right:0;}
  .quote[dir="rtl"] .q-table2 tr.total .col-lbl{text-align:right;}

  .saved-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .saved-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--panel2);border:1px solid var(--line);border-radius:7px;
    padding:8px 10px;font-size:13px;cursor:pointer;
  }
  .saved-item:hover{border-color:var(--gold-dim);}
  .saved-item button{background:none;border:none;color:var(--muted);cursor:pointer;}
  .saved-item button:hover{color:var(--red);}


  [dir="rtl"] #rateStatus{margin-left:0;margin-right:8px;}


  /* ── Mobile / phone responsive ────────────────────────────── */
  @media (max-width: 600px){
    .quote{padding:18px 12px;}
    .q-car{font-size:18px;}
    .q-date{font-size:11px;margin-bottom:14px;}
    .q-logo{height:24px;}

    /* Column widths: label narrower, numbers get more room */
    .q-table2 col.c-lbl{width:34%;}
    .q-table2 col.c-krw{width:33%;}
    .q-table2 col.c-fx {width:33%;}

    /* Font scales with viewport so all numbers fit without truncation */
    .q-table2{font-size:clamp(9px, 2.9vw, 12px);}
    .q-table2 th,.q-table2 td{padding:6px 2px;}
    .q-table2 th{padding-bottom:6px;}
    .q-table2 tr.total td{font-size:clamp(10px,3.2vw,14px);padding-top:14px;}
    /* Internal quote — full mobile overrides */
    .quote.int-formal{padding:14px 12px;--card-pad-x:12px;--card-pad-y:14px;}
    .quote.int-formal .q-car{font-size:20px;}
    .quote.int-formal .int-subtitle{font-size:8px;letter-spacing:0.1em;}
    .quote.int-formal .q-logo{height:20px;}
    .quote.q-has-split .q-split{flex-direction:column;min-height:0;}
    .quote.q-has-split .q-photo-side{flex:0 0 auto;width:100%;min-height:150px;padding:14px;}
    .quote.q-has-split .q-photo-name{font-size:20px;}
    .quote.q-has-split .q-content{padding:16px 12px;}
    .quote[dir="rtl"].q-has-split .q-split{flex-direction:column;}

    /* Metadata bar: 2×2 grid on mobile */
    .quote.int-formal .int-meta{grid-template-columns:repeat(2,1fr);gap:8px;padding:10px 0;}
    .quote.int-formal .im-lbl{font-size:8px;}
    .quote.int-formal .im-val{font-size:10.5px;}

    /* Table: scale font with viewport */
    .quote.int-formal .q-table2{font-size:clamp(9px,2.7vw,12px);}
    .quote.int-formal .q-table2 th,.quote.int-formal .q-table2 td{padding:6px 2px;}
    .quote.int-formal .q-table2 th{font-size:8px;letter-spacing:0.08em;padding-bottom:6px;}
    .quote.int-formal .q-table2 tr.int-sec td{font-size:8px;letter-spacing:0.1em;padding-top:12px;}

    /* Subtotal rows */
    .quote.int-formal .q-table2 tr.int-sub td{font-size:clamp(9px,2.7vw,12px);}

    /* Total row — scale numbers down */
    .quote.int-formal .q-table2 tr.int-total td{
      font-size:clamp(10px,3vw,13px);
      padding-top:10px;padding-bottom:10px;
    }
    .quote.int-formal .q-table2 tr.int-total td.col-krw,
    .quote.int-formal .q-table2 tr.int-total td.col-fx{
      font-size:clamp(10px,3.2vw,14px) !important;
    }

    /* Column widths for internal on mobile */
    .quote.int-formal .q-table2 col.c-lbl{width:36%;}
    .quote.int-formal .q-table2 col.c-krw{width:32%;}
    .quote.int-formal .q-table2 col.c-fx{width:32%;}
    .q-table2 tr.section td{padding-top:12px;padding-bottom:3px;}

    /* Labels wrap naturally — no truncation */
    .q-table2 td.col-lbl{
      word-break:break-word;
      overflow-wrap:break-word;
      white-space:normal;
    }
    /* Numbers: always on one line, never clip */
    .q-table2 td.col-krw,
    .q-table2 td.col-fx{white-space:nowrap;overflow:visible;}
    /* Total label also wraps */
    .q-table2 tr.total td.col-lbl{white-space:normal;}
  }

  @media (max-width: 360px){
    .q-table2{font-size:clamp(8px, 2.6vw, 10px);}
    .q-table2 col.c-lbl{width:34%;}
    .q-table2 col.c-krw{width:33%;}
    .q-table2 col.c-fx {width:33%;}
    .quote{padding:12px 8px;}
    .q-table2 td.col-lbl{white-space:normal;word-break:break-word;}
  }

  /* ── Internal quote redesign ─────────────────────────────── */
  .int-meta{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:8px;padding:12px 0 14px;
    border-bottom:1px solid #E5E7EB;margin-bottom:0;
  }
  .int-meta.int-meta-3{grid-template-columns:repeat(3,1fr);}
  .int-meta.int-meta-2{grid-template-columns:repeat(2,1fr);}
  .int-meta-col .im-lbl{
    font-size:9px;text-transform:uppercase;letter-spacing:0.1em;
    color:#9aa1ad;font-weight:700;margin-bottom:3px;
  }
  .int-meta-col .im-val{font-size:11.5px;color:#1B1E26;font-weight:600;}
  .int-meta-col .im-val.im-accent{color:#D4622A;font-family:'IBM Plex Mono',monospace;}
  /* Internal section labels — orange */
  .q-table2 tr.int-sec td{
    color:#6B0000;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:0.14em;
    border-bottom:none;padding-top:18px;padding-bottom:4px;
    background:transparent !important;
  }
  /* Subtotal rows (= Discounted price, = Vehicle offer price) */
  .q-table2 tr.int-sub td{
    background:#f3f4f6;font-weight:700;color:#1B1E26;
    border-bottom:1px solid #E5E7EB;
  }
  /* Internal TOTAL — dark bar */
  .q-table2 tr.int-total td{
    background:#800000;color:#ffffff;
    font-weight:700;font-size:15px;
    border:none !important;padding-top:15px;padding-bottom:15px;
  }
  .q-table2 tr.int-total td.col-fx{color:#ffffff !important;font-weight:800;}
  .q-table2 tr.int-total td.col-krw{color:#ffffff;}
  @media (max-width:600px){
    .int-meta{grid-template-columns:repeat(2,1fr);gap:10px;}
  }

  /* ── Internal prestige font styling ──────────────────────── */
  .quote.int-formal{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .quote.int-formal .q-logo{height:42px;}
  .quote.int-formal .q-car{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:26px;font-weight:700;color:#1B1E26;margin-bottom:0;}
  .quote.int-formal .int-subtitle{font-size:10px;text-transform:uppercase;letter-spacing:0.18em;color:#9aa1ad;margin-bottom:6px;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .quote.int-formal .im-lbl,.quote.int-formal .im-val{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;}
  .quote.int-formal .q-table2{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13.5px;}
  .quote.int-formal .q-table2 th{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:0.14em;font-size:9.5px;border-bottom:1.5px solid #1B1E26;}
  .quote.int-formal .q-table2 tr.int-sec td{letter-spacing:0.18em;font-size:9px;}
  .quote.int-formal .q-table2 tr.int-sub td{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:700;background:#F0F0F0;}
  .quote.int-formal .q-table2 .lbl-mut{font-style:italic;}
  .quote.int-formal .q-table2 tr.int-total td{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;}
  .quote.int-formal .q-table2 tr.int-total td.col-krw,
  .quote.int-formal .q-table2 tr.int-total td.col-fx{
    font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:16px;font-weight:700;
  }
  @media print{
    body{background:#fff;}
    header, .grid > .card:first-child, .preview-head, .saved-section{display:none !important;}
    .grid{grid-template-columns:1fr;}
    .wrap{padding:0;}
  }

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Deal <span>Calculator</span></h1>
      <div class="sub">Car cost, VAT/discount chain &amp; exchange rate &mdash; one source, two views</div>
    </div>
  </header>

  <div class="grid">
    <!-- INPUT PANEL -->
    <div class="card">
      <h2 id="h-vehicle">Vehicle</h2>
      <div class="row2">
        <div>
          <label id="l-carname">Car name</label>
          <input id="carName" placeholder="e.g. Lexus ES 350" oninput="render()">
        </div>
        <div>
          <label id="l-plate">Plate</label>
          <input id="plate" placeholder="e.g. ABC1234" oninput="render()">
        </div>
      </div>
      <div style="margin-top:10px;">
        <button onclick="toggleVIN()" id="vinToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="vinArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          VIN Number <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional)</span>
        </button>
        <div id="vinSection" style="display:none;margin-top:8px;">
          <input id="vinNumber" class="num-input" placeholder="e.g. 1HGBH41JXMN109186" oninput="render()" style="font-family:monospace;letter-spacing:0.05em;">
        </div>
      </div>

      <div style="margin-top:10px;">
        <button onclick="togglePhoto()" id="photoToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="photoArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Car Photo <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional, buyer view only)</span>
        </button>
        <div id="photoSection" style="display:none;margin-top:8px;">
          <div style="display:flex;align-items:center;gap:10px;">
            <input type="file" id="carPhotoInput" accept="image/*" onchange="handlePhotoUpload(event)" style="flex:1;min-width:0;font-size:11px;color:var(--muted);">
            <img id="carPhotoPreview" src="" alt="" style="display:none;width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;">
            <button type="button" id="carPhotoRemove" onclick="removeCarPhoto()" style="display:none;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;padding:0;flex-shrink:0;">Remove</button>
          </div>
        </div>
      </div>

      <h2 id="h-carprice" style="margin-top:22px;">Car Price</h2>
      <label id="l-carprice">Car price (KRW)</label>
      <input id="carPrice" class="num-input" type="number" placeholder="0" oninput="render()">

      <label id="l-auction">Auction fees (KRW)</label>
      <input id="auctionFees" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">

      <div class="calc-line"><span>Total car price</span><b id="line-totalcarprice">₩0</b></div>

      <h2 id="h-vat" style="margin-top:22px;">VAT / Tax Type</h2>
      <div class="vat-options">
        <label class="vat-opt" id="opt-invoice">
          <input type="radio" name="vatType" value="invoice" checked onchange="render()">
          Tax invoice
          <span class="tag">÷ 11</span>
        </label>
        <label class="vat-opt" id="opt-individual">
          <input type="radio" name="vatType" value="individual" onchange="render()">
          Individual
          <span class="tag">× 0.07</span>
        </label>
        <label class="vat-opt" id="opt-notax">
          <input type="radio" name="vatType" value="notax" onchange="render()">
          No tax
          <span class="tag">0</span>
        </label>
      </div>
      <div class="calc-line"><span>VAT amount</span><b id="line-vat">₩0</b></div>

      <label style="margin-top:18px;">Buyer's share of VAT (→ Karaba dc)</label>
      <select id="vatShare" onchange="render()">
        <option value="0">0% — No discount</option>
        <option value="10">10% (× 0.10)</option>
        <option value="20">20% (× 0.20)</option>
        <option value="30">30% (× 0.30)</option>
        <option value="40">40% (× 0.40)</option>
        <option value="50" selected>50% (× 0.50)</option>
        <option value="60">60% (× 0.60)</option>
      </select>

      <div class="calc-line"><span>Karaba dc</span><b id="line-half">₩0</b></div>
      <div class="calc-line"><span>Vehicle offer price</span><b id="line-offer">₩0</b></div>

      <div style="margin-top:10px;">
        <button onclick="toggleIncentives()" id="incentivesToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="incentivesArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Incentives <span style="font-size:10px;color:var(--muted);margin-left:2px;">(internal only)</span>
        </button>
        <div id="incentivesSection" style="display:none;margin-top:8px;">
          <input id="incentivesPct" class="num-input" type="number" placeholder="e.g. 20 (%)" oninput="render()">
        </div>
      </div>

      <h2 id="h-fees" style="margin-top:22px;">Fees on top (KRW)</h2>
      <div class="row2">
        <div>
          <label>Dealer Fee</label>
          <input id="fee" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
        <div>
          <label>Car carrier</label>
          <input id="carrier" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
      </div>
      <div style="margin-top:10px;">
        <button onclick="toggleHandling()" id="handlingToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="handlingArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Handling charges <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional)</span>
        </button>
        <div id="handlingSection" style="display:none;margin-top:8px;">
          <input id="handlingLabel" placeholder="Custom name (optional)" oninput="render()" style="margin-bottom:6px;">
          <input id="handling" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
      </div>
      <div style="margin-top:10px;">
        <button onclick="toggleParts()" id="partsToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="partsArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Parts <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional)</span>
        </button>
        <div id="partsSection" style="display:none;margin-top:8px;">
          <input id="parts" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
      </div>
      <div style="margin-top:10px;">
        <button onclick="toggleCustomFee()" id="customFeeToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="customFeeArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Customize Fees <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional)</span>
        </button>
        <div id="customFeeSection" style="display:none;margin-top:8px;">
          <input id="customFeeLabel" placeholder="Custom name (optional)" oninput="render()" style="margin-bottom:6px;">
          <input id="customFee" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
      </div>
      <h2 id="h-shipping" style="margin-top:22px;">Shipping cost (optional)</h2>
      <input id="shipping" class="num-input" type="number" placeholder="empty = FOB" oninput="render()">
      <div style="margin-top:10px;">
        <button onclick="toggleShoring()" id="shoringToggle" style="background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;display:flex;align-items:center;gap:5px;">
          <span id="shoringArrow" style="display:inline-block;transition:transform .2s;font-size:10px;">▶</span>
          Shoring <span style="font-size:10px;color:var(--muted);margin-left:2px;">(optional)</span>
        </button>
        <div id="shoringSection" style="display:none;margin-top:8px;">
          <input id="shoring" class="num-input" type="number" placeholder="leave empty to hide" oninput="render()">
        </div>
      </div>

      <h2 id="h-exchange" style="margin-top:22px;">Exchange Rate</h2>
      <div class="row2">
        <div>
          <label id="l-currency">Currency</label>
          <select id="currency" onchange="render()">
            <option value="USD" selected>USD ($)</option>
            <option value="EUR">EUR (€)</option>
          </select>
        </div>
        <div>
          <label id="l-rate">KRW per 1 unit</label>
          <input id="rate" class="num-input" type="number" placeholder="1350" oninput="render()">
        </div>
      </div>
      <button class="btn-link" onclick="fetchRate()" style="margin-top:8px;">Try fetch live rate</button>
      <span id="rateStatus" style="font-size:11px;color:var(--muted);margin-left:8px;"></span>

      <button class="btn-secondary" onclick="downloadPDF()">Download as PDF</button>
      <button class="btn-secondary" onclick="downloadImage()">Download as Photo</button>

    </div>

    <!-- PREVIEW PANEL -->
    <div>
      <div class="preview-head">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <div class="toggle">
            <button id="btnInternal" class="active internal" onclick="setView('internal')">Internal</button>
            <button id="btnBuyer" class="buyer" onclick="setView('buyer')">Buyer</button>
          </div>
          <div id="buyerLangWrap" style="display:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;">
            <button id="btnBuyerEN" onclick="setBuyerLang('en')" style="border:none;background:var(--gold);color:#1B1E26;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;">EN</button>
            <button id="btnBuyerAR" onclick="setBuyerLang('ar')" style="border:none;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;">AR</button>
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" onclick="downloadPDF()">Download PDF</button>
          <button class="icon-btn" onclick="downloadImage()">Download Photo</button>
          <button class="icon-btn" style="background:#25D366;border-color:#25D366;color:#0e1410;font-weight:700;" onclick="shareWhatsApp()">Share text via WhatsApp</button>
        </div>
      </div>

      <div class="quote" id="quote"></div>
    </div>
  </div>
</div>

let buyerLang = 'en';
let carPhotoDataUrl = null;

function handlePhotoUpload(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      // Resize/compress so storage stays reasonable, but keep enough resolution
      // for the full-width hero banner on the buyer quote to look sharp.
      const maxDim = 1600;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      carPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const preview = document.getElementById('carPhotoPreview');
      preview.src = carPhotoDataUrl;
      preview.style.display = '';
      document.getElementById('carPhotoRemove').style.display = '';
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removeCarPhoto(){
  carPhotoDataUrl = null;
  document.getElementById('carPhotoInput').value = '';
  document.getElementById('carPhotoPreview').style.display = 'none';
  document.getElementById('carPhotoRemove').style.display = 'none';
  render();
}

function fmtKRW(n){ return '₩' + Math.round(n||0).toLocaleString('en-US'); }
function curSymbol(cur){
  const map = {USD:'$',EUR:'€',GBP:'£',JPY:'¥',CNY:'¥',CAD:'$',AUD:'$',SGD:'$'};
  return map[(cur||'').toUpperCase()] || ((cur||'').toUpperCase() + ' ');
}
function fmtFX(n, cur){
  const sym = curSymbol(cur);
  return sym + Math.round(n||0).toLocaleString('en-US');
}
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getVatType(){
  return document.querySelector('input[name="vatType"]:checked').value;
}

function compute(){
  const carPrice = Number(document.getElementById('carPrice').value) || 0;
  const auctionFeesRaw = document.getElementById('auctionFees').value;
  const auctionFees = auctionFeesRaw === '' ? null : (Number(auctionFeesRaw) || 0);
  const totalCarPrice = carPrice + (auctionFees !== null ? auctionFees : 0); // car price + auction fees
  const vatBase = totalCarPrice; // total vehicle cost for VAT

  const vatType = getVatType();
  let vatAmount = 0;
  if(vatType === 'invoice') vatAmount = vatBase / 11;
  else if(vatType === 'individual') vatAmount = vatBase * 0.07;
  else vatAmount = 0;

  const sharePct = document.getElementById('vatShare').value !== '' ? Number(document.getElementById('vatShare').value) : 50;
  const half = vatAmount * (sharePct / 100);   // Karaba dc = VAT × chosen %
  const offerPrice = vatBase - half; // vehicle offer price

  const vatAfterKarabaDC = vatAmount - half; // Total VAT remaining after Karaba DC is deducted
  const incentivesEl = document.getElementById('incentivesPct');
  const incentivesRaw = incentivesEl ? incentivesEl.value : '';
  const incentivesPct = incentivesRaw === '' ? null : (Number(incentivesRaw) || 0);
  const incentivesAmount = incentivesPct !== null ? vatAfterKarabaDC * (incentivesPct / 100) : null;

  const feeRaw = document.getElementById('fee').value;
  const fee = feeRaw === '' ? null : (Number(feeRaw) || 0);
  const carrierRaw = document.getElementById('carrier').value;
  const carrier = carrierRaw === '' ? null : (Number(carrierRaw) || 0);
  const shippingRaw = document.getElementById('shipping').value;
  const shipping = shippingRaw === '' ? null : (Number(shippingRaw) || 0);
  const isCIF = shipping !== null;
  const shoringEl = document.getElementById('shoring');
  const shoring = shoringEl && shoringEl.value.trim() !== '' ? (Number(shoringEl.value) || 0) : null;
  const handlingRaw = document.getElementById('handling').value;
  const handling = handlingRaw === '' ? null : (Number(handlingRaw) || 0);
  const handlingLabelEl = document.getElementById('handlingLabel');
  const handlingLabel = handlingLabelEl && handlingLabelEl.value.trim() ? handlingLabelEl.value.trim() : 'Handling charges';
  const partsRaw = document.getElementById('parts').value;
  const parts = partsRaw === '' ? null : (Number(partsRaw) || 0);
  const customFeeRaw = document.getElementById('customFee').value;
  const customFee = customFeeRaw === '' ? null : (Number(customFeeRaw) || 0);
  const customFeeLabelEl = document.getElementById('customFeeLabel');
  const customFeeLabel = customFeeLabelEl && customFeeLabelEl.value.trim() ? customFeeLabelEl.value.trim() : 'Customize Fees';

  const totalKRW = offerPrice
    + (fee !== null ? fee : 0)
    + (carrier !== null ? carrier : 0)
    + (isCIF ? shipping : 0)
    + (handling !== null ? handling : 0)
    + (parts !== null ? parts : 0)
    + (customFee !== null ? customFee : 0)
    + (shoring !== null ? shoring : 0);
  const rate = Number(document.getElementById('rate').value) || 0;
  const fob = rate > 0 ? totalKRW / rate : 0;

  const vin = (document.getElementById('vinNumber') ? document.getElementById('vinNumber').value.trim() : '');
  return {carPrice, auctionFees, totalCarPrice, vatBase, vatType, vatAmount, sharePct, half, vatAfterKarabaDC, incentivesPct, incentivesAmount, offerPrice, fee, carrier, shipping, isCIF, handling, handlingLabel, parts, customFee, customFeeLabel, shoring, totalKRW, rate, fob, vin};
}

function render(){
  const vt = getVatType();
  document.getElementById('opt-invoice').classList.toggle('active', vt==='invoice');
  document.getElementById('opt-individual').classList.toggle('active', vt==='individual');
  document.getElementById('opt-notax').classList.toggle('active', vt==='notax');

  const c = compute();

  document.getElementById('line-totalcarprice').textContent = fmtKRW(c.totalCarPrice);
  document.getElementById('line-vat').textContent = fmtKRW(c.vatAmount);
  document.getElementById('line-half').textContent = fmtKRW(c.half);
  document.getElementById('line-offer').textContent = fmtKRW(c.offerPrice);

  const carName = document.getElementById('carName').value || 'Untitled vehicle';
  const plate = document.getElementById('plate').value || '';
  const currency = (document.getElementById('currency').value || 'USD').toUpperCase();
  const conv = (krw) => c.rate > 0 ? krw / c.rate : 0;

  const isBuyer = view === 'buyer';
  const isAR = isBuyer && buyerLang === 'ar';
  const dir = isAR ? 'rtl' : 'ltr';

  const todayRaw = new Date();
  const today = isAR
    ? todayRaw.toLocaleDateString('ar-EG', {day:'2-digit', month:'short', year:'numeric'})
    : todayRaw.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});

  // ── Meta bar — same design for both views, including VIN.
  //    Exchange rate only shows once a rate has actually been entered. ──
  const showVin = true;
  const showRate = c.rate > 0;
  const lbl = {
    vin:   isAR ? 'رقم الهيكل' : 'VIN',
    plate: isAR ? 'اللوحة'     : 'Plate',
    date:  isAR ? 'التاريخ'    : 'Date',
    rate:  isAR ? 'سعر الصرف'  : 'Exchange rate'
  };
  let metaCols = '';
  let metaColCount = 0;
  if(showVin){ metaCols += '<div class="int-meta-col"><div class="im-lbl">'+lbl.vin+'</div><div class="im-val">'+escapeHtml(c.vin||'—')+'</div></div>'; metaColCount++; }
  metaCols += '<div class="int-meta-col"><div class="im-lbl">'+lbl.plate+'</div><div class="im-val">'+escapeHtml(plate||'—')+'</div></div>'; metaColCount++;
  metaCols += '<div class="int-meta-col"><div class="im-lbl">'+lbl.date+'</div><div class="im-val">'+today+'</div></div>'; metaColCount++;
  if(showRate){ metaCols += '<div class="int-meta-col"><div class="im-lbl">'+lbl.rate+'</div><div class="im-val">1 '+escapeHtml(currency)+' = '+fmtKRW(c.rate)+'</div></div>'; metaColCount++; }
  const metaHtml = '<div class="int-meta'+(metaColCount===4?'':' int-meta-'+metaColCount)+'">' + metaCols + '</div>';

  // ── Line items — internal gets the full cost breakdown, buyer gets the client-safe summary ──
  let irows = '';
  if(!isBuyer){
    irows += intSec('Vehicle Cost');
    irows += intRow('Car price', c.carPrice, conv(c.carPrice), currency);
    if(c.auctionFees !== null && c.auctionFees > 0) irows += intRow('Auction fees', c.auctionFees, conv(c.auctionFees), currency);
    irows += intSub('Total car price', c.vatBase, conv(c.vatBase), currency);

    if(c.sharePct > 0){
      const vatSecLabel = c.vatType === 'invoice' ? 'VAT (Tax invoice ÷11)'
        : c.vatType === 'individual' ? 'VAT (Individual ×0.07)'
        : 'VAT (No tax)';
      irows += intSec(vatSecLabel);
      irows += intMuted('VAT Amount', c.vatAmount, conv(c.vatAmount), currency);
      irows += intRow('Karaba DC, '+c.sharePct+'%', c.half, conv(c.half), currency);
      if(c.incentivesPct !== null){
        irows += intMuted('Total VAT', c.vatAfterKarabaDC, conv(c.vatAfterKarabaDC), currency);
        irows += intRow('Incentives '+c.incentivesPct+'%', c.incentivesAmount, conv(c.incentivesAmount), currency);
      }
      irows += intSub('Car DC price', c.offerPrice, conv(c.offerPrice), currency);
    }

    irows += intSec('Fees');
    if(c.fee !== null) irows += intRow('Dealer fee', c.fee, conv(c.fee), currency);
    if(c.carrier !== null) irows += intRow('Car carrier', c.carrier, conv(c.carrier), currency);
    if(c.handling !== null) irows += intRow(c.handlingLabel, c.handling, conv(c.handling), currency);
    if(c.parts !== null) irows += intRow('Parts', c.parts, conv(c.parts), currency);
    if(c.customFee !== null) irows += intRow(c.customFeeLabel, c.customFee, conv(c.customFee), currency);
    if(c.isCIF || c.shoring !== null){
      irows += intSec('Shipping');
      if(c.isCIF) irows += intRow('Shipping cost', c.shipping, conv(c.shipping), currency);
      if(c.shoring !== null) irows += intRow('Shoring', c.shoring, conv(c.shoring), currency);
    }
    irows += intTotal(c.isCIF ? 'TOTAL / CFR' : 'TOTAL / FOB', c.totalKRW, c.fob, currency);
  } else {
    irows += intRow(isAR ? 'سعر المركبة'      : 'Vehicle price', c.offerPrice, conv(c.offerPrice), currency);
    if(c.fee !== null) irows += intRow(isAR ? 'رسوم الوكيل' : 'Dealer Fee', c.fee, conv(c.fee), currency);
    if(c.carrier !== null) irows += intRow(isAR ? 'رسوم نقل السيارة' : 'Car carrier', c.carrier, conv(c.carrier), currency);
    if(c.isCIF) irows += intRow(isAR ? 'رسوم الشحن' : 'Shipping cost', c.shipping, conv(c.shipping), currency);
    if(c.shoring !== null) irows += intRow(isAR ? 'رسوم التثبيت' : 'Shoring', c.shoring, conv(c.shoring), currency);
    if(c.handling !== null) irows += intRow(c.handlingLabel, c.handling, conv(c.handling), currency);
    if(c.parts !== null) irows += intRow(isAR ? 'قطع الغيار' : 'Parts', c.parts, conv(c.parts), currency);
    if(c.customFee !== null) irows += intRow(c.customFeeLabel, c.customFee, conv(c.customFee), currency);
    irows += intTotal(isAR ? 'الإجمالي' : 'TOTAL / ' + (c.isCIF ? 'CFR' : 'FOB'), c.totalKRW, c.fob, currency);
  }

  const badgeLabel = isBuyer ? (isAR ? 'عرض السعر' : 'Quote') : 'Internal';
  // Same badge colors for both — buyer uses "buyer" as the class name (never "quote",
  // which would collide with the outer .quote card container and break its box sizing).
  const badgeClass = isBuyer ? 'buyer' : 'internal';

  const quoteEl = document.getElementById('quote');
  quoteEl.setAttribute('dir', dir);

  // Photo only ever shows on the buyer/quote side, never internal — rendered as a
  // full-height side panel (not a top banner), with the invoice content untouched.
  const showPhotoSide = isBuyer && !!carPhotoDataUrl;

  const tableHtml =
    '<table class="q-table2" dir="'+dir+'">'
    + '<colgroup><col class="c-lbl"><col class="c-krw"><col class="c-fx"></colgroup>'
    + '<thead><tr>'
    + '<th class="col-lbl">'+(isAR ? 'البنود' : 'Line Item')+'</th>'
    + '<th class="col-krw">KRW</th>'
    + '<th class="col-fx">'+escapeHtml(currency)+'</th>'
    + '</tr></thead>'
    + '<tbody>'+irows+'</tbody>'
    + '</table>';

  if(showPhotoSide){
    quoteEl.className = 'quote int-formal q-has-split';
    const logoJustify = isAR ? 'flex-start' : 'flex-end';
    quoteEl.innerHTML =
      '<div class="q-split">'
      + '<div class="q-photo-side">'
      + '<div class="q-photo-bg" style="background-image:url(' + carPhotoDataUrl + ');"></div>'
      + '<img class="q-photo-img" src="' + carPhotoDataUrl + '" alt="Car photo">'
      + '<div class="q-badge '+badgeClass+'" style="display:inline-block;">'+badgeLabel+'</div>'
      + '<div class="q-photo-name">'+escapeHtml(carName)+'</div>'
      + '</div>'
      + '<div class="q-content">'
      + '<div style="display:flex;justify-content:'+logoJustify+';margin-bottom:14px;">'
      + '<img class="q-logo" src="'+LOGO_DATA_URI+'" alt="Karaba">'
      + '</div>'
      + metaHtml
      + tableHtml
      + '</div>'
      + '</div>';
  } else {
    quoteEl.className = 'quote int-formal';
    quoteEl.innerHTML =
      '<div class="q-head" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:4px;">'
      + '<div><div class="q-badge '+badgeClass+'" style="display:inline-block;">'+badgeLabel+'</div>'
      + '<div class="q-car">'+escapeHtml(carName)+'</div></div>'
      + '<img class="q-logo" src="'+LOGO_DATA_URI+'" alt="Karaba">'
      + '</div>'
      + metaHtml
      + tableHtml;
  }
}

// ── Internal redesign helpers ──
function intSec(label){
  return '<tr class="int-sec"><td colspan="3" class="col-lbl">'+escapeHtml(label)+'</td></tr>';
}
function intSub(label, krw, fx, cur){
  return '<tr class="int-sub"><td class="col-lbl">= '+escapeHtml(label)+'</td>'
    +'<td class="col-krw krw-reg">'+fmtKRW(krw)+'</td>'
    +'<td class="col-fx fx-reg">'+fmtFX(fx,cur)+'</td></tr>';
}
function intMuted(label, krw, fx, cur){
  return '<tr><td class="col-lbl lbl-mut">'+escapeHtml(label)+'</td>'
    +'<td class="col-krw krw-mut">'+fmtKRW(krw)+'</td>'
    +'<td class="col-fx fx-mut">'+fmtFX(fx,cur)+'</td></tr>';
}
function intTotal(label, krw, fx, cur){
  return '<tr class="int-total"><td class="col-lbl">'+escapeHtml(label)+'</td>'
    +'<td class="col-krw">'+fmtKRW(krw)+'</td>'
    +'<td class="col-fx">'+fmtFX(fx,cur)+'</td></tr>';
}
function intRow(label, krw, fx, cur){
  return '<tr><td class="col-lbl">'+escapeHtml(label)+'</td>'
    +'<td class="col-krw krw-reg">'+fmtKRW(krw)+'</td>'
    +'<td class="col-fx fx-reg">'+fmtFX(fx,cur)+'</td></tr>';
}

// ---------- Export quote card as PDF / Photo (no print dialog needed) ----------
async function captureQuote(){
  const node = document.getElementById('quote');
  return await html2canvas(node, {scale: 2, backgroundColor: '#ffffff'});
}

async function downloadPDF(){
  try{
    const canvas = await captureQuote();
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
      unit: 'px',
      format: [canvas.width, canvas.height]
    });
    pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
    const carName = (document.getElementById('carName').value || 'quote').replace(/[^a-z0-9]+/gi,'_');
    pdf.save(carName + '_' + view + '.pdf');
  }catch(e){
    console.error(e);
    alert('Could not generate PDF. Try Download Photo instead.');
  }
}

async function downloadImage(){
  try{
    const canvas = await captureQuote();
    const carName = (document.getElementById('carName').value || 'quote').replace(/[^a-z0-9]+/gi,'_');
    canvas.toBlob(async (blob) => {
      // On mobile, try native share sheet first (lets user pick WhatsApp directly)
      const file = new File([blob], carName + '_' + view + '.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title: carName});
          return;
        }catch(e){ /* user cancelled or unsupported, fall back to download */ }
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = carName + '_' + view + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  }catch(e){
    console.error(e);
    alert('Could not generate the image.');
  }
}

// ---------- Share via WhatsApp (always buyer-safe, regardless of current toggle) ----------
function shareWhatsApp(){
  const c = compute();
  const carName = document.getElementById('carName').value || 'Vehicle';
  const plate = document.getElementById('plate').value || '';
  const currency = (document.getElementById('currency').value || 'USD').toUpperCase();
  const conv = (krw) => c.rate > 0 ? krw / c.rate : 0;
  const todayRaw = new Date();
  const today = (view==='buyer' && buyerLang==='ar')
    ? todayRaw.toLocaleDateString('ar-EG', {day:'2-digit', month:'short', year:'numeric'})
    : todayRaw.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});

  const waAR = buyerLang === 'ar';
  const lines = [];
  lines.push(`*${carName}*`);
  if(plate) lines.push(`Plate: ${plate}`);
  lines.push(`Quote date: ${today}`);
  lines.push('');
  lines.push(`${waAR?'سعر المركبة':'Vehicle price'}: ${fmtKRW(c.offerPrice)}  (${fmtFX(conv(c.offerPrice), currency)})`);
  if(c.fee !== null) lines.push(`${waAR?'رسوم الوكيل':'Dealer Fee'}: ${fmtKRW(c.fee)}  (${fmtFX(conv(c.fee), currency)})`);
  if(c.carrier !== null) lines.push(`${waAR?'رسوم نقل السيارة':'Car carrier'}: ${fmtKRW(c.carrier)}  (${fmtFX(conv(c.carrier), currency)})`);
  if(c.isCIF) lines.push(`${waAR?'رسوم الشحن':'Shipping cost'}: ${fmtKRW(c.shipping)}  (${fmtFX(conv(c.shipping), currency)})`);
  if(c.handling !== null) lines.push(`${c.handlingLabel}: ${fmtKRW(c.handling)}  (${fmtFX(conv(c.handling), currency)})`);
  if(c.parts !== null) lines.push(`${waAR?'قطع الغيار':'Parts'}: ${fmtKRW(c.parts)}  (${fmtFX(conv(c.parts), currency)})`);
  if(c.customFee !== null) lines.push(`${c.customFeeLabel}: ${fmtKRW(c.customFee)}  (${fmtFX(conv(c.customFee), currency)})`);
  lines.push('');
  lines.push(`*${waAR ? 'الإجمالي' : 'TOTAL / ' + (c.isCIF ? 'CFR' : 'FOB')}: ${fmtKRW(c.totalKRW)}  (${fmtFX(c.fob, currency)})*`);
  if(c.rate > 0) lines.push('');
  if(c.rate > 0) lines.push(`(1 ${currency} = ${fmtKRW(c.rate)})`);

  const text = lines.join('\n');
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

// ---------- Live rate (best effort, falls back to manual) ----------
// Note: this pulls a mid-market rate from a free public API, then subtracts 20 KRW
// as a rough approximation of your bank's transfer-received rate. It is NOT pulled from
// Naver directly (browsers block that), so always double-check against Naver if it matters.
async function fetchRate(){
  const status = document.getElementById('rateStatus');
  const currency = (document.getElementById('currency').value || 'USD').toUpperCase();
  status.textContent = 'fetching...';
  try{
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/KRW');
    const data = await res.json();
    const perUnitKrw = data && data.rates && data.rates[currency];
    if(perUnitKrw){
      const midMarket = 1 / perUnitKrw;
      const adjusted = Math.round(midMarket) - 20;
      document.getElementById('rate').value = adjusted;
      render();
      status.textContent = 'updated (mid-market −20) ✓';
      render();
    } else {
      status.textContent = 'currency not found — enter manually';
    }
  }catch(e){
    status.textContent = 'fetch blocked — enter manually';
  }
  setTimeout(()=>status.textContent='', 5000);
}

// ---------- Persistence ----------
async function saveDeal(){
  const deal = {
    carName: document.getElementById('carName').value,
    plate: document.getElementById('plate').value,
    carPrice: document.getElementById('carPrice').value,
    vatType: getVatType(),
    vatShare: document.getElementById('vatShare').value,
    fee: document.getElementById('fee').value,
    carrier: document.getElementById('carrier').value,
    shipping: document.getElementById('shipping').value,
    handling: document.getElementById('handling').value,
    handlingLabel: document.getElementById('handlingLabel').value,
    parts: document.getElementById('parts').value,
    customFee: document.getElementById('customFee').value,
    customFeeLabel: document.getElementById('customFeeLabel').value,
    currency: document.getElementById('currency').value,
    rate: document.getElementById('rate').value,
    carPhoto: carPhotoDataUrl || '',
    savedAt: new Date().toISOString()
  };
  const id = 'deal_' + Date.now();
  try{
    await window.storage.set(id, JSON.stringify(deal));
    await loadSavedList();
  }catch(e){
    console.error('Save failed', e);
    alert('Could not save deal.');
  }
}

async function loadSavedList(){
  const el = document.getElementById('savedList');
  try{
    const res = await window.storage.list('deal_');
    if(!res || !res.keys || res.keys.length === 0){
      el.innerHTML = '<div style="color:var(--muted);font-size:12px;">No saved deals yet.</div>';
      return;
    }
    const items = [];
    for(const key of res.keys){
      try{
        const r = await window.storage.get(key);
        if(r) items.push({key, deal: JSON.parse(r.value)});
      }catch(e){}
    }
    items.sort((a,b)=> (b.deal.savedAt||'').localeCompare(a.deal.savedAt||''));
    el.innerHTML = items.map(it => `
      <div class="saved-item">
        <span onclick='loadDeal(${JSON.stringify(it.key)})' style="flex:1;cursor:pointer;">
          ${escapeHtml(it.deal.carName || 'Untitled')} <span style="color:var(--muted)">— ${escapeHtml(it.deal.currency||'')}</span>
        </span>
        <button onclick='deleteDeal(${JSON.stringify(it.key)})'>&times;</button>
      </div>
    `).join('');
  }catch(e){
    el.innerHTML = '<div style="color:var(--muted);font-size:12px;">No saved deals yet.</div>';
  }
}

async function loadDeal(key){
  try{
    const r = await window.storage.get(key);
    if(!r) return;
    const deal = JSON.parse(r.value);
    document.getElementById('carName').value = deal.carName || '';
    document.getElementById('plate').value = deal.plate || '';
    document.getElementById('carPrice').value = deal.carPrice || '';
    document.querySelector(`input[name="vatType"][value="${deal.vatType||'invoice'}"]`).checked = true;
    document.getElementById('vatShare').value = deal.vatShare || '50';
    document.getElementById('fee').value = deal.fee || '';
    document.getElementById('carrier').value = deal.carrier || '';
    document.getElementById('shipping').value = deal.shipping || '';
    document.getElementById('handling').value = deal.handling || '';
    document.getElementById('handlingLabel').value = deal.handlingLabel || '';
    document.getElementById('parts').value = deal.parts || '';
    document.getElementById('customFee').value = deal.customFee || '';
    document.getElementById('customFeeLabel').value = deal.customFeeLabel || '';
    document.getElementById('currency').value = deal.currency || 'USD';
    document.getElementById('rate').value = deal.rate || '';
    carPhotoDataUrl = deal.carPhoto || null;
    const photoSection = document.getElementById('photoSection');
    const photoArrow = document.getElementById('photoArrow');
    const photoPreview = document.getElementById('carPhotoPreview');
    const photoRemove = document.getElementById('carPhotoRemove');
    if(carPhotoDataUrl){
      photoPreview.src = carPhotoDataUrl;
      photoPreview.style.display = '';
      photoRemove.style.display = '';
      photoSection.style.display = '';
      photoArrow.style.transform = 'rotate(90deg)';
    } else {
      photoPreview.style.display = 'none';
      photoRemove.style.display = 'none';
      photoSection.style.display = 'none';
      photoArrow.style.transform = '';
    }
    document.getElementById('carPhotoInput').value = '';
    render();
  }catch(e){
    console.error(e);
  }
}

async function deleteDeal(key){
  try{
    await window.storage.delete(key);
    await loadSavedList();
  }catch(e){console.error(e);}
}

// ---------- Init ----------
render();
loadSavedList();
</script>
